<!DOCTYPE html>
<html>
<head>
  <title>Soundboard</title>
</head>
<body style="background:#111;color:white;text-align:center;font-family:Arial;">

<h1>🔊 Soundboard</h1>

<button onclick="playSound('chinese-gong-meme-sound-effect.mp3')">Chinese</button>
<button onclick="playSound('airhorn.mp3')">📣 AIRHORN</button>
<button onclick="playSound('laugh.mp3')">😂 LAUGH</button>
<button onclick="playSound('tsb-phonk.mp3')">TSB PHONK</button>
<button onclick="playSound('youre-phone-is-ringing.mp3')">YO PHONE LINGIN</button>
<button onclick="playSound('chinese-guy-rap.mp3')">Chinese Rap</button>
<button onclick="playSound('n-word-song.mp3')">N Word Song</button>
<button onclick="playSound('long-brain-fart.mp3')">Long Brain Fart</button>
<button onclick="playSound('long-a-brain-fart-meme.mp3')">Fart meme</button>
<button onclick="playSound('patrick-arabic-meme.mp3')">Patrick Noo</button>
<button onclick="playSound('guitar-meme.mp3')">guitar meme</button>

<br><br>

<button onclick="stopAll()" style="background:red;color:white;padding:15px;font-size:16px;">
🛑 STOP ALL
</button>

<br><br>

🔊 Volume:
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.4">
<span id="volValue">0.4</span>

<br><br>

🔊 Bass:
<input type="range" id="bass" min="0" max="30" value="0"><br><br>

💥 Distortion:
<input type="range" id="distortion" min="0" max="100" value="0"><br><br>

⏩ Speed:
<input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
<span id="speedValue">1x</span>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let activeSources = [];
let buffers = {};

// sliders
const speedSlider = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");

const volSlider = document.getElementById("volume");
const volValue = document.getElementById("volValue");

// display values
speedSlider.oninput = () => {
  speedValue.textContent = speedSlider.value + "x";
};

volSlider.oninput = () => {
  volValue.textContent = volSlider.value;
};

// distortion
function createDistortion(amount) {
  let k = amount * 10;
  let n_samples = 44100;
  let curve = new Float32Array(n_samples);

  for (let i = 0; i < n_samples; i++) {
    let x = i * 2 / n_samples - 1;
    curve[i] = (1 + k) * x / (1 + k * Math.abs(x));
  }
  return curve;
}

// ALL sounds
const soundFiles = [
  "chinese-gong-meme-sound-effect.mp3",
  "airhorn.mp3",
  "laugh.mp3",
  "tsb-phonk.mp3",
  "youre-phone-is-ringing.mp3",
  "chinese-guy-rap.mp3",
  "n-word-song.mp3",
  "long-brain-fart.mp3",
  "long-a-fart-meme.mp3",
  "patrick-arabic-meme.mp3",
  "guitar-meme.mp3"
];

// preload
async function loadSounds() {
  for (let file of soundFiles) {
    try {
      const res = await fetch(file);
      const arr = await res.arrayBuffer();
      buffers[file] = await audioCtx.decodeAudioData(arr);
    } catch (e) {
      console.log("Failed:", file);
    }
  }
}
loadSounds();

// play
async function playSound(file) {
  audioCtx.resume();

  if (!buffers[file]) {
    const res = await fetch(file);
    const arr = await res.arrayBuffer();
    buffers[file] = await audioCtx.decodeAudioData(arr);
  }

  const bassVal = parseFloat(document.getElementById("bass").value);
  const distVal = parseFloat(document.getElementById("distortion").value) / 100;
  const speedVal = parseFloat(document.getElementById("speed").value);
  const volumeVal = parseFloat(document.getElementById("volume").value);

  const source = audioCtx.createBufferSource();
  source.buffer = buffers[file];
  source.playbackRate.value = speedVal;

  const gain = audioCtx.createGain();
  gain.gain.value = volumeVal;

  const bass = audioCtx.createBiquadFilter();
  bass.type = "lowshelf";
  bass.frequency.value = 200;
  bass.gain.value = bassVal;

  let lastNode = bass;

  if (distVal > 0) {
    const distortion = audioCtx.createWaveShaper();
    distortion.curve = createDistortion(distVal);
    bass.connect(distortion);
    lastNode = distortion;
  }

  source.connect(bass);
  lastNode.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);

  activeSources.push(source);

  source.onended = () => {
    activeSources = activeSources.filter(s => s !== source);
  };
}

// stop all
function stopAll() {
  activeSources.forEach(source => {
    try { source.stop(); } catch(e) {}
  });
  activeSources = [];
}
</script>

</body>
</html>
