<!DOCTYPE html>
<html>
<head>
  <title>Soundboard</title>
</head>
<body style="background:#111;color:white;text-align:center;font-family:Arial;">

<h1>🔊 Soundboard</h1>

<button onclick="playSound('chinese-gong-meme-sound-effect.mp3')">Chinese</button>
<button onclick="playSound('airhorn.mp3')">📣 AIRHORN</button>
<button onclick="playSound('laugh.mp3')">😂 LAUGH</button>
<button onclick="playSound('tsb-phonk.mp3')">TSB PHONK</button>
<button onclick="playSound('youre-phone-is-ringing.mp3')">YO PHONE LINGIN</button>
<button onclick="playSound('chinese-guy-rap.mp3')">Chinese Rap</button>

<br><br>

<button onclick="stopAll()" style="background:red;color:white;padding:15px;font-size:16px;">
🛑 STOP ALL
</button>

<br><br>

🔊 Bass:
<input type="range" id="bass" min="0" max="30" value="0"><br><br>

💥 Distortion:
<input type="range" id="distortion" min="0" max="100" value="0"><br><br>

⏩ Speed:
<input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
<span id="speedValue">1x</span>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

let activeSources = [];
let buffers = {};
let loaded = false;

// speed display
const speedSlider = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");

speedSlider.oninput = () => {
  speedValue.textContent = speedSlider.value + "x";
};

// distortion
function createDistortion(amount) {
  let k = amount,
      n_samples = 44100,
      curve = new Float32Array(n_samples);

  for (let i = 0; i < n_samples; i++) {
    let x = i * 2 / n_samples - 1;
    curve[i] = (3 + k) * x / (Math.PI + k * Math.abs(x));
  }
  return curve;
}

// sound list
const soundFiles = [
  "chinese-gong-meme-sound-effect.mp3",
  "airhorn.mp3",
  "laugh.mp3",
  "tsb-phonk.mp3",
  "youre-phone-is-ringing.mp3",
  "chinese-guy-rap.mp3"
];

// preload
async function loadSounds() {
  for (let file of soundFiles) {
    try {
      const res = await fetch(file);
      const arr = await res.arrayBuffer();
      buffers[file] = await audioCtx.decodeAudioData(arr);
    } catch (e) {
      console.error("Failed to load:", file);
    }
  }
  loaded = true;
  console.log("Sounds loaded");
}
loadSounds();

// play
async function playSound(file) {
  audioCtx.resume();

  // 🔥 fallback if not loaded yet
  if (!buffers[file]) {
    const res = await fetch(file);
    const arr = await res.arrayBuffer();
    buffers[file] = await audioCtx.decodeAudioData(arr);
  }

  const bassVal = document.getElementById("bass").value;
  const distVal = document.getElementById("distortion").value;
  const speedVal = document.getElementById("speed").value;

  const source = audioCtx.createBufferSource();
  source.buffer = buffers[file];
  source.playbackRate.value = speedVal;

  const gain = audioCtx.createGain();
  gain.gain.value = 0.5;

  const bass = audioCtx.createBiquadFilter();
  bass.type = "lowshelf";
  bass.frequency.value = 200;
  bass.gain.value = bassVal;

  const distortion = audioCtx.createWaveShaper();
  distortion.curve = createDistortion(distVal);

  source.connect(bass);
  bass.connect(distortion);
  distortion.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);

  activeSources.push(source);

  source.onended = () => {
    activeSources = activeSources.filter(s => s !== source);
  };
}

// stop all
function stopAll() {
  activeSources.forEach(source => {
    try { source.stop(); } catch(e) {}
  });
  activeSources = [];
}
</script>

</body>
</html>
